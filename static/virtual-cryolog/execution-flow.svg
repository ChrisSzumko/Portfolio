<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480"
     role="img" aria-labelledby="title description">
  <title id="title">VirtualCryolog telemetry pipeline</title>
  <desc id="description">
    Cryolog SQL Server records flow through a checkpointed VirtualCryolog worker to CryoHub Cloud,
    with optional AWS Secrets Manager credentials and CloudWatch heartbeat monitoring.
  </desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06141f"/>
      <stop offset="55%" stop-color="#0b2535"/>
      <stop offset="100%" stop-color="#0e3a4c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity=".38"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#67e8f9"/>
    </marker>
  </defs>

  <rect width="1440" height="480" rx="28" fill="url(#background)"/>
  <circle cx="1325" cy="36" r="180" fill="#38bdf8" opacity=".07"/>
  <circle cx="85" cy="470" r="190" fill="#67e8f9" opacity=".05"/>
  <path d="M0 405C240 350 380 470 650 410s460-10 790-80v150H0Z" fill="#67e8f9" opacity=".035"/>

  <g fill="none" stroke="#bae6fd" stroke-width="2" opacity=".16">
    <path d="M1278 75v76M1245 94l66 38M1311 94l-66 38"/>
    <path d="M1280 75l-9 14m9-14 9 14m-44 5 17 1m-17-1 8-15m58 15-17 1m17-1-8-15m8 53-17-1m17 1-8 15m-58-15 17-1m-17 1 8 15"/>
  </g>

  <text x="72" y="68" fill="#67e8f9" font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="15" font-weight="700" letter-spacing="4">CRYOGENIC TELEMETRY BRIDGE</text>
  <text x="72" y="125" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="48" font-weight="750">VirtualCryolog</text>
  <text x="72" y="164" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="20">Resilient, checkpointed delivery from local Cryolog devices to CryoHub Cloud.</text>

  <g filter="url(#shadow)">
    <rect x="72" y="225" width="330" height="165" rx="20" fill="#0f2d3d" stroke="#285267"/>
    <rect x="555" y="225" width="330" height="165" rx="20" fill="#0f3344" stroke="#38bdf8"/>
    <rect x="1038" y="225" width="330" height="165" rx="20" fill="#0f2d3d" stroke="#285267"/>
  </g>

  <!-- Cryolog database -->
  <g transform="translate(103 262)" fill="none" stroke="url(#accent)" stroke-width="3">
    <ellipse cx="38" cy="12" rx="34" ry="11"/>
    <path d="M4 12v56c0 6 15 11 34 11s34-5 34-11V12"/>
    <path d="M4 40c0 6 15 11 34 11s34-5 34-11"/>
  </g>
  <text x="196" y="275" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="22" font-weight="700">Cryolog SQL</text>
  <text x="196" y="307" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="16">DeviceRecord telemetry</text>
  <text x="196" y="333" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="16">Local SQL Server Express</text>
  <rect x="196" y="350" width="116" height="24" rx="12" fill="#164e63"/>
  <text x="254" y="367" text-anchor="middle" fill="#a5f3fc"
        font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">SOURCE</text>

  <!-- Worker -->
  <g transform="translate(584 258)" fill="none" stroke="url(#accent)" stroke-width="3">
    <rect x="3" y="3" width="72" height="72" rx="15"/>
    <path d="M22 28h34M22 40h34M22 52h22"/>
    <path d="M62 51l7 7-14 14"/>
  </g>
  <text x="678" y="275" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="22" font-weight="700">Sync worker</text>
  <text x="678" y="307" fill="#bae6fd" font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="16">Transform • retry • isolate</text>
  <text x="678" y="333" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="16">Atomic CSV checkpoints</text>
  <rect x="678" y="350" width="134" height="24" rx="12" fill="#075985"/>
  <text x="745" y="367" text-anchor="middle" fill="#e0f2fe"
        font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">PYTHON 3.12+</text>

  <!-- CryoHub cloud -->
  <g transform="translate(1067 264)" fill="none" stroke="url(#accent)" stroke-width="3">
    <path d="M18 65h50c15 0 25-9 25-22 0-12-9-21-21-22C68 8 58 2 46 2 29 2 17 14 16 30 7 33 2 39 2 48c0 10 7 17 16 17Z"/>
    <path d="M31 45h34M48 29v32"/>
  </g>
  <text x="1172" y="275" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="22" font-weight="700">CryoHub Cloud</text>
  <text x="1172" y="307" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="16">CryoHub v2 API</text>
  <text x="1172" y="333" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="16">Channel telemetry + alarms</text>
  <rect x="1172" y="350" width="118" height="24" rx="12" fill="#164e63"/>
  <text x="1231" y="367" text-anchor="middle" fill="#a5f3fc"
        font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">DESTINATION</text>

  <g fill="none" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow)">
    <path d="M420 307h108"/>
    <path d="M903 307h108"/>
  </g>
  <g fill="#bae6fd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">
    <text x="474" y="292" text-anchor="middle">READ</text>
    <text x="957" y="292" text-anchor="middle">DELIVER</text>
  </g>

  <g transform="translate(72 427)">
    <circle cx="7" cy="-5" r="5" fill="#22c55e"/>
    <text x="22" y="0" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">
      Resume-safe checkpoints
    </text>
    <circle cx="225" cy="-5" r="5" fill="#38bdf8"/>
    <text x="240" y="0" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">
      Per-device failure isolation
    </text>
    <circle cx="470" cy="-5" r="5" fill="#a78bfa"/>
    <text x="485" y="0" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">
      CloudWatch heartbeat
    </text>
  </g>
</svg>
